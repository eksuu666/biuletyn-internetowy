name: slodziak

x-app: &app
  build:
    context: .
    target: app
  image: slodziak/app:${APP_IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - ${APP_ENV_FILE:-.env.production}
  volumes:
    - app_storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - internal

services:
  app:
    <<: *app
    environment:
      RUN_MIGRATIONS: "true"
      RUN_BOOTSTRAP_SEED: "true"
      CACHE_CONFIGURATION: "true"

  web:
    build:
      context: .
      target: web
    image: slodziak/web:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - internal

  worker:
    <<: *app
    command: php artisan queue:work redis --sleep=2 --tries=3 --timeout=120 --max-time=3600
    environment:
      RUN_MIGRATIONS: "false"
      RUN_BOOTSTRAP_SEED: "false"
      CACHE_CONFIGURATION: "true"
    stop_grace_period: 2m

  scheduler:
    <<: *app
    command: php artisan schedule:work
    environment:
      RUN_MIGRATIONS: "false"
      RUN_BOOTSTRAP_SEED: "false"
      CACHE_CONFIGURATION: "true"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-slodziak}
      MARIADB_USER: ${DB_USERNAME:-slodziak}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

volumes:
  app_storage:
  db_data:
  redis_data:

networks:
  internal:
    driver: bridge
